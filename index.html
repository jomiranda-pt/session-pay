<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Pay</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .month {
      color: #666;
      margin-bottom: 20px;
    }

    .summary {
      background: #f0f4f8;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .summary h2 {
      margin-top: 0;
    }

    .numbers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .number {
      background: white;
      padding: 12px;
      border-radius: 10px;
    }

    .number strong {
      display: block;
      font-size: 20px;
      margin-top: 5px;
    }

    .client {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .client h3 {
      margin: 0 0 8px 0;
    }

    .client p {
      margin: 4px 0;
      color: #555;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      background: #222;
      color: white;
    }

    .secondary {
      background: #e8edf2;
      color: #222;
    }

    .form-box {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #fafafa;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #eef7ee;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Session Pay</h1>
  <div class="month">Controle de sessões e pagamentos</div>

  <section class="summary">

    <h2>Resumo</h2>

    <div class="numbers">

      <div class="number">
        Alunos
        <strong id="totalAlunos">0</strong>
      </div>

      <div class="number">
        Sessões
        <strong id="totalSessoes">0</strong>
      </div>

      <div class="number">
        Total
        <strong id="totalValor">R$ 0,00</strong>
      </div>

      <div class="number">
        Pago
        <strong id="totalPago">R$ 0,00</strong>
      </div>

      <div class="number">
        Em aberto
        <strong id="totalAberto">R$ 0,00</strong>
      </div>

    </div>

  </section>

  <h2>Alunos</h2>

  <div id="listaAlunos"></div>

  <button class="secondary" onclick="abrirCadastroAluno()">
    + Cadastrar aluno
  </button>

  <div class="form-box" id="formAluno">

    <h2>Novo aluno</h2>

    <label>Nome</label>
    <input
      type="text"
      id="nomeAluno"
      placeholder="Nome do aluno"
    >

    <label>Forma de cobrança</label>

    <select
      id="tipoCobranca"
      onchange="mostrarCamposCobranca()"
    >
      <option value="sessao">Por sessão</option>
      <option value="quinzenal">Quinzenal</option>
      <option value="mensal">Mensal</option>
      <option value="pacote">Pacote</option>
    </select>

    <div id="campoSessao">

      <label>Valor da sessão</label>

      <input
        type="number"
        id="valorSessao"
        placeholder="Ex.: 100"
      >

    </div>

    <div id="campoQuinzenal" style="display:none">

      <label>Valor quinzenal</label>

      <input
        type="number"
        id="valorQuinzenal"
        placeholder="Ex.: 350"
      >

    </div>

    <div id="campoMensal" style="display:none">

      <label>Valor mensal</label>

      <input
        type="number"
        id="valorMensal"
        placeholder="Ex.: 700"
      >

    </div>

    <div id="campoPacote" style="display:none">

      <label>Quantidade de sessões no pacote</label>

      <input
        type="number"
        id="quantidadePacote"
        placeholder="Ex.: 10"
      >

      <label>Valor total do pacote</label>

      <input
        type="number"
        id="valorPacote"
        placeholder="Ex.: 900"
      >

    </div>

    <button onclick="salvarAluno()">
      Salvar aluno
    </button>

    <div class="success" id="mensagemAluno">
      Aluno cadastrado ✓
    </div>

  </div>

  <button class="secondary" onclick="limparDadosTeste()">
    Limpar dados de teste
  </button>

  <button onclick="abrirFormulario()">
    + Registrar sessão
  </button>

  <div class="form-box" id="formSessao">

    <h2>Nova sessão</h2>

    <label>Aluno</label>
    <select id="aluno"></select>

    <label>Data</label>
    <input type="date" id="data">

    <label>Status</label>

    <select id="status">
      <option value="realizada">Realizada</option>
      <option value="falta">Falta</option>
      <option value="cancelada">Cancelada</option>
    </select>

    <label>Cobrar?</label>

    <select id="cobrar">
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <label>Pagamento</label>

    <select id="pagamento">
      <option value="aberto">Em aberto</option>
      <option value="pago">Pago</option>
    </select>

    <button onclick="salvarSessao()">
      Salvar sessão
    </button>

    <div class="success" id="mensagemSessao">
      Sessão registrada ✓
    </div>

  </div>

</div>

<script>

  let alunos =
    JSON.parse(localStorage.getItem("alunos")) || [];

  let sessoes =
    JSON.parse(localStorage.getItem("sessoes")) || [];


  function abrirCadastroAluno() {

    document.getElementById("formAluno").style.display =
      "block";

  }


  function mostrarCamposCobranca() {

    const tipo =
      document.getElementById("tipoCobranca").value;

    document.getElementById("campoSessao").style.display =
      "none";

    document.getElementById("campoQuinzenal").style.display =
      "none";

    document.getElementById("campoMensal").style.display =
      "none";

    document.getElementById("campoPacote").style.display =
      "none";


    if (tipo === "sessao") {

      document.getElementById("campoSessao").style.display =
        "block";

    }


    if (tipo === "quinzenal") {

      document.getElementById("campoQuinzenal").style.display =
        "block";

    }


    if (tipo === "mensal") {

      document.getElementById("campoMensal").style.display =
        "block";

    }


    if (tipo === "pacote") {

      document.getElementById("campoPacote").style.display =
        "block";

    }

  }


  function salvarAluno() {

    const nome =
      document.getElementById("nomeAluno").value.trim();

    const tipo =
      document.getElementById("tipoCobranca").value;


    if (!nome) {

      alert("Digite o nome do aluno.");

      return;

    }


    let valorSessao = 0;
    let valorQuinzenal = 0;
    let valorMensal = 0;
    let quantidadePacote = 0;
    let valorPacote = 0;


    if (tipo === "sessao") {

      valorSessao =
        Number(
          document.getElementById("valorSessao").value
        );

    }


    if (tipo === "quinzenal") {

      valorQuinzenal =
        Number(
          document.getElementById("valorQuinzenal").value
        );

    }


    if (tipo === "mensal") {

      valorMensal =
        Number(
          document.getElementById("valorMensal").value
        );

    }


    if (tipo === "pacote") {

      quantidadePacote =
        Number(
          document.getElementById("quantidadePacote").value
        );

      valorPacote =
        Number(
          document.getElementById("valorPacote").value
        );

      if (quantidadePacote > 0) {

        valorSessao =
          valorPacote / quantidadePacote;

      }

    }


    const aluno = {

      id: Date.now(),

      nome,
      tipo,
      valorSessao,
      valorQuinzenal,
      valorMensal,
      quantidadePacote,
      valorPacote

    };


    alunos.push(aluno);


    localStorage.setItem(
      "alunos",
      JSON.stringify(alunos)
    );


    document.getElementById("nomeAluno").value = "";

    document.getElementById("valorSessao").value = "";

    document.getElementById("valorQuinzenal").value = "";

    document.getElementById("valorMensal").value = "";

    document.getElementById("quantidadePacote").value = "";

    document.getElementById("valorPacote").value = "";


    document.getElementById("mensagemAluno").style.display =
      "block";


    atualizarAlunos();

    atualizarResumo();

  }


  function atualizarAlunos() {

    const lista =
      document.getElementById("listaAlunos");

    const select =
      document.getElementById("aluno");


    lista.innerHTML = "";

    select.innerHTML = "";


    if (alunos.length === 0) {

      lista.innerHTML =
        "<p style='color:#666'>Nenhum aluno cadastrado ainda.</p>";

      select.innerHTML =
        "<option>Cadastre um aluno primeiro</option>";

      return;

    }


    alunos.forEach(aluno => {

      const card =
        document.createElement("div");

      card.className =
        "client";


      let descricao = "";


      if (aluno.tipo === "sessao") {

        descricao =
          "R$ " +
          aluno.valorSessao
            .toFixed(2)
            .replace(".", ",") +
          " por sessão";

      }


      if (aluno.tipo === "quinzenal") {

        descricao =
          "R$ " +
          aluno.valorQuinzenal
            .toFixed(2)
            .replace(".", ",") +
          " por quinzena";

      }


      if (aluno.tipo === "mensal") {

        descricao =
          "R$ " +
          aluno.valorMensal
            .toFixed(2)
            .replace(".", ",") +
          " por mês";

      }


      if (aluno.tipo === "pacote") {

        descricao =
          aluno.quantidadePacote +
          " sessões — R$ " +
          aluno.valorPacote
            .toFixed(2)
            .replace(".", ",");

      }


      card.innerHTML =
        "<h3>" +
        aluno.nome +
        "</h3>" +
        "<p>" +
        descricao +
        "</p>";


      lista.appendChild(card);


      const option =
        document.createElement("option");

      option.value =
        aluno.id;

      option.textContent =
        aluno.nome;

      select.appendChild(option);

    });

  }


  function abrirFormulario() {

    if (alunos.length === 0) {

      alert("Cadastre um aluno primeiro.");

      return;

    }


    document.getElementById("formSessao").style.display =
      "block";


    if (!document.getElementById("data").value) {

      const hoje =
        new Date();

      document.getElementById("data").value =
        hoje.toISOString().split("T")[0];

    }

  }


  function salvarSessao() {

    const alunoId =
      Number(
        document.getElementById("aluno").value
      );


    const aluno =
      alunos.find(
        a => a.id === alunoId
      );


    if (!aluno) {

      alert("Selecione um aluno.");

      return;

    }


    const data =
      document.getElementById("data").value;

    const status =
      document.getElementById("status").value;

    const cobrar =
      document.getElementById("cobrar").value;

    const pagamento =
      document.getElementById("pagamento").value;


    let valor = 0;


    if (cobrar === "sim") {

      if (aluno.tipo === "sessao") {

        valor =
          aluno.valorSessao;

      }


      if (aluno.tipo === "pacote") {

        valor =
          aluno.valorSessao;

      }

    }


    const sessao = {

      id: Date.now(),

      alunoId:
        aluno.id,

      alunoNome:
        aluno.nome,

      data,
      status,
      cobrar,
      pagamento,
      valor

    };


    sessoes.push(sessao);


    localStorage.setItem(
      "sessoes",
      JSON.stringify(sessoes)
    );


    document.getElementById("mensagemSessao").style.display =
      "block";


    atualizarResumo();

  }


  function atualizarResumo() {

    let totalValor = 0;
    let totalPago = 0;
    let totalAberto = 0;


    sessoes.forEach(sessao => {

      totalValor +=
        Number(
          sessao.valor || 0
        );


      if (sessao.pagamento === "pago") {

        totalPago +=
          Number(
            sessao.valor || 0
          );

      } else {

        totalAberto +=
          Number(
            sessao.valor || 0
          );

      }

    });


    document.getElementById("totalAlunos").textContent =
      alunos.length;


    document.getElementById("totalSessoes").textContent =
      sessoes.length;


    document.getElementById("totalValor").textContent =
      "R$ " +
      totalValor
        .toFixed(2)
        .replace(".", ",");


    document.getElementById("totalPago").textContent =
      "R$ " +
      totalPago
        .toFixed(2)
        .replace(".", ",");


    document.getElementById("totalAberto").textContent =
      "R$ " +
      totalAberto
        .toFixed(2)
        .replace(".", ",");

  }


  function limparDadosTeste() {

    const confirmar =
      confirm(
        "Deseja apagar todos os alunos e sessões cadastrados neste navegador?"
      );


    if (!confirmar) {

      return;

    }


    alunos = [];

    sessoes = [];


    localStorage.removeItem("alunos");

    localStorage.removeItem("sessoes");


    atualizarAlunos();

    atualizarResumo();


    alert("Dados de teste apagados.");

  }


  atualizarAlunos();

  atualizarResumo();

</script>

</body>
</html>
