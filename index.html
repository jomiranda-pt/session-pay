<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Pay</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 20px;
    }

    h1 { margin-bottom: 5px; }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .summary {
      background: #f0f4f8;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .summary h2 { margin-top: 0; }

    .numbers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .number {
      background: white;
      padding: 12px;
      border-radius: 10px;
    }

    .number strong {
      display: block;
      font-size: 20px;
      margin-top: 5px;
    }

    .client {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 14px;
    }

    .client h3 {
      margin: 0 0 8px 0;
    }

    .client p {
      margin: 4px 0;
      color: #555;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      background: #222;
      color: white;
    }

    .secondary {
      background: #e8edf2;
      color: #222;
    }

    .small-button {
      padding: 10px;
      font-size: 14px;
      margin-top: 8px;
    }

    .form-box {
      display: none;
      margin-top: 20px;
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #fafafa;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #eef7ee;
    }

    .historico {
      display: none;
      margin-top: 14px;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }

    .sessao-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .sessao-data {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .sessao-detalhe {
      font-size: 14px;
      color: #555;
      margin: 2px 0;
    }

    .quinzena-box {
      background: #f7f8fa;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    .quinzena-box strong {
      display: block;
      margin-bottom: 5px;
    }

    .pago {
      color: #187a35;
      font-weight: bold;
    }

    .aberto {
      color: #b45b00;
      font-weight: bold;
    }

    .edicao-sessao {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Session Pay</h1>
  <div class="subtitle">Controle de sessões e pagamentos</div>

  <section class="summary">
    <h2>Resumo</h2>

    <div class="numbers">
      <div class="number">
        Alunos
        <strong id="totalAlunos">0</strong>
      </div>

      <div class="number">
        Sessões
        <strong id="totalSessoes">0</strong>
      </div>

      <div class="number">
        Total
        <strong id="totalValor">R$ 0,00</strong>
      </div>

      <div class="number">
        Pago
        <strong id="totalPago">R$ 0,00</strong>
      </div>

      <div class="number">
        Em aberto
        <strong id="totalAberto">R$ 0,00</strong>
      </div>
    </div>
  </section>

  <h2>Alunos</h2>

  <div id="listaAlunos"></div>

  <button class="secondary" onclick="abrirCadastroAluno()">
    + Cadastrar aluno
  </button>

  <div class="form-box" id="formAluno">

    <h2>Novo aluno</h2>

    <label>Nome</label>
    <input type="text" id="nomeAluno" placeholder="Nome do aluno">

    <label>Forma de cobrança</label>

    <select id="tipoCobranca" onchange="mostrarCamposCobranca()">
      <option value="sessao">Por sessão</option>
      <option value="quinzenal">Quinzenal</option>
      <option value="mensal">Mensal</option>
      <option value="pacote">Pacote</option>
    </select>

    <div id="campoSessao">
      <label>Valor da sessão</label>
      <input type="number" id="valorSessao" placeholder="Ex.: 100">
    </div>

    <div id="campoQuinzenal" style="display:none">
      <label>Valor quinzenal</label>
      <input type="number" id="valorQuinzenal" placeholder="Ex.: 400">
    </div>

    <div id="campoMensal" style="display:none">
      <label>Valor mensal</label>
      <input type="number" id="valorMensal" placeholder="Ex.: 700">
    </div>

    <div id="campoPacote" style="display:none">
      <label>Quantidade de sessões no pacote</label>
      <input type="number" id="quantidadePacote" placeholder="Ex.: 10">

      <label>Valor total do pacote</label>
      <input type="number" id="valorPacote" placeholder="Ex.: 900">
    </div>

    <button onclick="salvarAluno()">
      Salvar aluno
    </button>

    <div class="success" id="mensagemAluno">
      Aluno cadastrado ✓
    </div>

  </div>

  <button onclick="abrirFormulario()">
    + Registrar sessão
  </button>

  <div class="form-box" id="formSessao">

    <h2>Nova sessão</h2>

    <label>Aluno</label>
    <select id="aluno" onchange="atualizarCamposSessao()"></select>

    <label>Data</label>
    <input type="date" id="data">

    <label>Status</label>
    <select id="status" onchange="atualizarCamposSessao()">
      <option value="realizada">Realizada</option>
      <option value="falta">Falta</option>
      <option value="reposicao">Reposição</option>
      <option value="cancelada">Cancelada</option>
    </select>

    <div id="campoReposicao" style="display:none">
      <label>Qual falta está sendo reposta?</label>
      <select id="faltaReposicao"></select>
    </div>

    <div id="campoCobrar">
      <label>Cobrar?</label>
      <select id="cobrar">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
      </select>
    </div>

    <label>Pagamento</label>
    <select id="pagamento">
      <option value="aberto">Em aberto</option>
      <option value="pago">Pago</option>
    </select>

    <button onclick="salvarSessao()">
      Salvar sessão
    </button>

    <div class="success" id="mensagemSessao">
      Sessão registrada ✓
    </div>

  </div>

  <button class="secondary" onclick="limparDadosTeste()">
    Limpar dados de teste
  </button>

</div>

<script>

let alunos =
  JSON.parse(localStorage.getItem("alunos")) || [];

let sessoes =
  JSON.parse(localStorage.getItem("sessoes")) || [];

let cobrancas =
  JSON.parse(localStorage.getItem("cobrancas")) || [];


function formatarDinheiro(valor) {
  return "R$ " +
    Number(valor || 0)
      .toFixed(2)
      .replace(".", ",");
}


function formatarData(data) {

  if (!data) return "Data não informada";

  const partes = data.split("-");

  return partes[2] + "/" +
         partes[1] + "/" +
         partes[0];
}


function abrirCadastroAluno() {
  document.getElementById("formAluno").style.display = "block";
}


function mostrarCamposCobranca() {

  const tipo =
    document.getElementById("tipoCobranca").value;

  document.getElementById("campoSessao").style.display = "none";
  document.getElementById("campoQuinzenal").style.display = "none";
  document.getElementById("campoMensal").style.display = "none";
  document.getElementById("campoPacote").style.display = "none";

  if (tipo === "sessao") {
    document.getElementById("campoSessao").style.display = "block";
  }

  if (tipo === "quinzenal") {
    document.getElementById("campoQuinzenal").style.display = "block";
  }

  if (tipo === "mensal") {
    document.getElementById("campoMensal").style.display = "block";
  }

  if (tipo === "pacote") {
    document.getElementById("campoPacote").style.display = "block";
  }
}


function salvarAluno() {

  const nome =
    document.getElementById("nomeAluno").value.trim();

  const tipo =
    document.getElementById("tipoCobranca").value;

  if (!nome) {
    alert("Digite o nome do aluno.");
    return;
  }

  let valorSessao = 0;
  let valorQuinzenal = 0;
  let valorMensal = 0;
  let quantidadePacote = 0;
  let valorPacote = 0;

  if (tipo === "sessao") {
    valorSessao =
      Number(document.getElementById("valorSessao").value);
  }

  if (tipo === "quinzenal") {
    valorQuinzenal =
      Number(document.getElementById("valorQuinzenal").value);
  }

  if (tipo === "mensal") {
    valorMensal =
      Number(document.getElementById("valorMensal").value);
  }

  if (tipo === "pacote") {

    quantidadePacote =
      Number(document.getElementById("quantidadePacote").value);

    valorPacote =
      Number(document.getElementById("valorPacote").value);

    if (quantidadePacote > 0) {
      valorSessao =
        valorPacote / quantidadePacote;
    }
  }

  const aluno = {
    id: Date.now(),
    nome,
    tipo,
    valorSessao,
    valorQuinzenal,
    valorMensal,
    quantidadePacote,
    valorPacote
  };

  alunos.push(aluno);

  localStorage.setItem(
    "alunos",
    JSON.stringify(alunos)
  );

  document.getElementById("nomeAluno").value = "";
  document.getElementById("valorSessao").value = "";
  document.getElementById("valorQuinzenal").value = "";
  document.getElementById("valorMensal").value = "";
  document.getElementById("quantidadePacote").value = "";
  document.getElementById("valorPacote").value = "";

  document.getElementById("mensagemAluno").style.display =
    "block";

  atualizarAlunos();
  atualizarResumo();
}


function descricaoAluno(aluno) {

  if (aluno.tipo === "sessao") {
    return formatarDinheiro(aluno.valorSessao) +
      " por sessão";
  }

  if (aluno.tipo === "quinzenal") {
    return formatarDinheiro(aluno.valorQuinzenal) +
      " por quinzena";
  }

  if (aluno.tipo === "mensal") {
    return formatarDinheiro(aluno.valorMensal) +
      " por mês";
  }

  if (aluno.tipo === "pacote") {
    return aluno.quantidadePacote +
      " sessões — " +
      formatarDinheiro(aluno.valorPacote);
  }

  return "";
}


function obterCobrancaQuinzena(alunoId, quinzena) {

  const hoje = new Date();

  const mes =
    hoje.getFullYear() +
    "-" +
    String(hoje.getMonth() + 1).padStart(2, "0");

  return cobrancas.find(c =>
    Number(c.alunoId) === Number(alunoId) &&
    c.tipo === "quinzenal" &&
    c.periodo === mes &&
    c.quinzena === quinzena
  );
}


function registrarCobrancaQuinzenal(alunoId, quinzena) {

  const aluno =
    alunos.find(a =>
      Number(a.id) === Number(alunoId)
    );

  if (!aluno) return;

  const existente =
    obterCobrancaQuinzena(alunoId, quinzena);

  if (existente) {

    alert(
      "Esta quinzena já foi lançada."
    );

    return;
  }

  const hoje = new Date();

  const mes =
    hoje.getFullYear() +
    "-" +
    String(hoje.getMonth() + 1).padStart(2, "0");

  cobrancas.push({
    id: Date.now(),
    alunoId: aluno.id,
    alunoNome: aluno.nome,
    tipo: "quinzenal",
    periodo: mes,
    quinzena,
    valor: Number(aluno.valorQuinzenal || 0),
    pagamento: "aberto"
  });

  localStorage.setItem(
    "cobrancas",
    JSON.stringify(cobrancas)
  );

  atualizarAlunos();
  atualizarResumo();
}


function marcarQuinzenaPaga(alunoId, quinzena) {

  const cobranca =
    obterCobrancaQuinzena(
      alunoId,
      quinzena
    );

  if (!cobranca) return;

  cobranca.pagamento = "pago";

  localStorage.setItem(
    "cobrancas",
    JSON.stringify(cobrancas)
  );

  atualizarAlunos();
  atualizarResumo();
}


function obterCobrancaMensal(alunoId) {

  const hoje = new Date();

  const mes =
    hoje.getFullYear() +
    "-" +
    String(hoje.getMonth() + 1).padStart(2, "0");

  return cobrancas.find(c =>
    Number(c.alunoId) === Number(alunoId) &&
    c.tipo === "mensal" &&
    c.periodo === mes
  );
}


function registrarCobrancaMensal(alunoId) {

  const aluno =
    alunos.find(a =>
      Number(a.id) === Number(alunoId)
    );

  if (!aluno) return;

  const existente =
    obterCobrancaMensal(alunoId);

  if (existente) {
    alert("Esta mensalidade já foi lançada.");
    return;
  }

  const hoje = new Date();

  const mes =
    hoje.getFullYear() +
    "-" +
    String(hoje.getMonth() + 1).padStart(2, "0");

  cobrancas.push({
    id: Date.now(),
    alunoId: aluno.id,
    alunoNome: aluno.nome,
    tipo: "mensal",
    periodo: mes,
    valor: Number(aluno.valorMensal || 0),
    pagamento: "aberto"
  });

  localStorage.setItem(
    "cobrancas",
    JSON.stringify(cobrancas)
  );

  atualizarAlunos();
  atualizarResumo();
}


function marcarMensalidadePaga(alunoId) {

  const cobranca =
    obterCobrancaMensal(alunoId);

  if (!cobranca) return;

  cobranca.pagamento = "pago";

  localStorage.setItem(
    "cobrancas",
    JSON.stringify(cobrancas)
  );

  atualizarAlunos();
  atualizarResumo();
}


function obterCobrancaPacote(alunoId) {

  return cobrancas.find(c =>
    Number(c.alunoId) === Number(alunoId) &&
    c.tipo === "pacote"
  );
}


function registrarCobrancaPacote(alunoId) {

  const aluno =
    alunos.find(a =>
      Number(a.id) === Number(alunoId)
    );

  if (!aluno) return;

  const existente =
    obterCobrancaPacote(alunoId);

  if (existente) {
    alert("Este pacote já foi lançado.");
    return;
  }

  cobrancas.push({
    id: Date.now(),
    alunoId: aluno.id,
    alunoNome: aluno.nome,
    tipo: "pacote",
    valor: Number(aluno.valorPacote || 0),
    pagamento: "aberto"
  });

  localStorage.setItem(
    "cobrancas",
    JSON.stringify(cobrancas)
  );

  atualizarAlunos();
  atualizarResumo();
}


function marcarPacotePago(alunoId) {

  const cobranca =
    obterCobrancaPacote(alunoId);

  if (!cobranca) return;

  cobranca.pagamento = "pago";

  localStorage.setItem(
    "cobrancas",
    JSON.stringify(cobrancas)
  );

  atualizarAlunos();
  atualizarResumo();
}


function atualizarAlunos() {

  const lista =
    document.getElementById("listaAlunos");

  const select =
    document.getElementById("aluno");

  lista.innerHTML = "";
  select.innerHTML = "";

  if (alunos.length === 0) {

    lista.innerHTML =
      "<p style='color:#666'>Nenhum aluno cadastrado ainda.</p>";

    select.innerHTML =
      "<option>Cadastre um aluno primeiro</option>";

    return;
  }

  alunos.forEach(aluno => {

    const sessoesAluno =
      sessoes
        .filter(s =>
          Number(s.alunoId) ===
          Number(aluno.id)
        )
        .sort((a, b) =>
          String(b.data)
            .localeCompare(String(a.data))
        );

    let historicoHtml = "";

    if (sessoesAluno.length === 0) {

      historicoHtml =
        "<p>Nenhuma sessão registrada ainda.</p>";

    } else {

      sessoesAluno.forEach(sessao => {

        historicoHtml +=
          "<div class='sessao-item'>" +

          "<div class='sessao-data'>" +
          formatarData(sessao.data) +
          "</div>" +

          "<div class='sessao-detalhe'>" +
          "Status: " +
          sessao.status +
          "</div>" +

          "<div class='sessao-detalhe'>" +
          "Cobrar: " +
          (sessao.cobrar === "sim" ? "Sim" : "Não") +
          "</div>" +

          (
            sessao.status === "reposicao" &&
            sessao.faltaOrigemId
            ?
            (
              () => {
                const faltaOrigem =
                  sessoes.find(s =>
                    Number(s.id) ===
                    Number(sessao.faltaOrigemId)
                  );

                return faltaOrigem
                  ? "<div class='sessao-detalhe'>" +
                    "Reposição da falta de " +
                    formatarData(faltaOrigem.data) +
                    "</div>"
                  : "";
              }
            )()
            :
            ""
          ) +

          (
            Number(sessao.valor || 0) > 0
            ?
            "<div class='sessao-detalhe'>" +
            "Valor: " +
            formatarDinheiro(sessao.valor) +
            "</div>"
            :
            ""
          ) +

          "<button class='secondary small-button' " +
          "onclick='abrirEdicaoSessao(" +
          sessao.id +
          ")'>" +
          "Editar" +
          "</button>" +

          "<button class='secondary small-button' " +
          "onclick='desfazerSessao(" +
          sessao.id +
          ")'>" +
          "Desfazer" +
          "</button>" +

          "<div class='edicao-sessao' id='editar-" +
          sessao.id +
          "'>" +

          "<label>Data</label>" +
          "<input type='date' id='editar-data-" +
          sessao.id +
          "' value='" +
          sessao.data +
          "'>" +

          "<label>Status</label>" +
          "<select id='editar-status-" +
          sessao.id +
          "'>" +
          "<option value='realizada'" +
          (sessao.status === "realizada" ? " selected" : "") +
          ">Realizada</option>" +
          "<option value='falta'" +
          (sessao.status === "falta" ? " selected" : "") +
          ">Falta</option>" +
          "<option value='cancelada'" +
          (sessao.status === "cancelada" ? " selected" : "") +
          ">Cancelada</option>" +
          "</select>" +

          "<label>Cobrar?</label>" +
          "<select id='editar-cobrar-" +
          sessao.id +
          "'>" +
          "<option value='sim'" +
          (sessao.cobrar === "sim" ? " selected" : "") +
          ">Sim</option>" +
          "<option value='nao'" +
          (sessao.cobrar === "nao" ? " selected" : "") +
          ">Não</option>" +
          "</select>" +

          "<label>Pagamento</label>" +
          "<select id='editar-pagamento-" +
          sessao.id +
          "'>" +
          "<option value='aberto'" +
          (sessao.pagamento === "aberto" ? " selected" : "") +
          ">Em aberto</option>" +
          "<option value='pago'" +
          (sessao.pagamento === "pago" ? " selected" : "") +
          ">Pago</option>" +
          "</select>" +

          "<button class='small-button' onclick='salvarEdicaoSessao(" +
          sessao.id +
          ")'>Salvar alterações</button>" +

          "<button class='secondary small-button' onclick='abrirEdicaoSessao(" +
          sessao.id +
          ")'>Cancelar</button>" +

          "</div>" +

          "</div>";
      });
    }

    let financeiroQuinzenal = "";

    if (aluno.tipo === "quinzenal") {

      const primeira =
        obterCobrancaQuinzena(
          aluno.id,
          1
        );

      const segunda =
        obterCobrancaQuinzena(
          aluno.id,
          2
        );

      financeiroQuinzenal +=
        "<div class='quinzena-box'>" +
        "<strong>1ª quinzena — dias 1 a 15</strong>";

      if (!primeira) {

        financeiroQuinzenal +=
          "<span class='aberto'>Ainda não lançada</span>" +

          "<button class='small-button' " +
          "onclick='registrarCobrancaQuinzenal(" +
          aluno.id +
          ",1)'>" +
          "Lançar " +
          formatarDinheiro(aluno.valorQuinzenal) +
          "</button>";

      } else if (
        primeira.pagamento === "pago"
      ) {

        financeiroQuinzenal +=
          "<span class='pago'>Pago ✓</span>";

      } else {

        financeiroQuinzenal +=
          "<span class='aberto'>" +
          formatarDinheiro(primeira.valor) +
          " — Em aberto</span>" +

          "<button class='small-button' " +
          "onclick='marcarQuinzenaPaga(" +
          aluno.id +
          ",1)'>" +
          "Marcar como pago" +
          "</button>";
      }

      financeiroQuinzenal +=
        "</div>";


      financeiroQuinzenal +=
        "<div class='quinzena-box'>" +
        "<strong>2ª quinzena — dia 16 ao fim do mês</strong>";

      if (!segunda) {

        financeiroQuinzenal +=
          "<span class='aberto'>Ainda não lançada</span>" +

          "<button class='small-button' " +
          "onclick='registrarCobrancaQuinzenal(" +
          aluno.id +
          ",2)'>" +
          "Lançar " +
          formatarDinheiro(aluno.valorQuinzenal) +
          "</button>";

      } else if (
        segunda.pagamento === "pago"
      ) {

        financeiroQuinzenal +=
          "<span class='pago'>Pago ✓</span>";

      } else {

        financeiroQuinzenal +=
          "<span class='aberto'>" +
          formatarDinheiro(segunda.valor) +
          " — Em aberto</span>" +

          "<button class='small-button' " +
          "onclick='marcarQuinzenaPaga(" +
          aluno.id +
          ",2)'>" +
          "Marcar como pago" +
          "</button>";
      }

      financeiroQuinzenal +=
        "</div>";
    }

    let financeiroMensal = "";

    if (aluno.tipo === "mensal") {

      const mensalidade =
        obterCobrancaMensal(aluno.id);

      financeiroMensal +=
        "<div class='quinzena-box'>" +
        "<strong>Mensalidade do mês atual</strong>";

      if (!mensalidade) {

        financeiroMensal +=
          "<span class='aberto'>Ainda não lançada</span>" +

          "<button class='small-button' " +
          "onclick='registrarCobrancaMensal(" +
          aluno.id +
          ")'>" +
          "Lançar " +
          formatarDinheiro(aluno.valorMensal) +
          "</button>";

      } else if (
        mensalidade.pagamento === "pago"
      ) {

        financeiroMensal +=
          "<span class='pago'>Pago ✓</span>";

      } else {

        financeiroMensal +=
          "<span class='aberto'>" +
          formatarDinheiro(mensalidade.valor) +
          " — Em aberto</span>" +

          "<button class='small-button' " +
          "onclick='marcarMensalidadePaga(" +
          aluno.id +
          ")'>" +
          "Marcar como pago" +
          "</button>";
      }

      financeiroMensal +=
        "</div>";
    }


    let financeiroPacote = "";

    if (aluno.tipo === "pacote") {

      const cobrancaPacote =
        obterCobrancaPacote(aluno.id);

      const sessoesConsumidas =
        sessoesAluno.filter(sessao =>
          sessao.cobrar === "sim" &&
          (
            sessao.status === "realizada" ||
            sessao.status === "falta"
          )
        ).length;

      const restantes =
        Math.max(
          Number(aluno.quantidadePacote || 0) -
          sessoesConsumidas,
          0
        );

      financeiroPacote +=
        "<div class='quinzena-box'>" +
        "<strong>Pacote</strong>" +
        "<div class='sessao-detalhe'>" +
        "Restam: " +
        restantes +
        " de " +
        Number(aluno.quantidadePacote || 0) +
        " sessões</div>";

      if (!cobrancaPacote) {

        financeiroPacote +=
          "<span class='aberto'>Pagamento ainda não lançado</span>" +

          "<button class='small-button' " +
          "onclick='registrarCobrancaPacote(" +
          aluno.id +
          ")'>" +
          "Lançar " +
          formatarDinheiro(aluno.valorPacote) +
          "</button>";

      } else if (
        cobrancaPacote.pagamento === "pago"
      ) {

        financeiroPacote +=
          "<span class='pago'>" +
          formatarDinheiro(cobrancaPacote.valor) +
          " — Pago ✓</span>";

      } else {

        financeiroPacote +=
          "<span class='aberto'>" +
          formatarDinheiro(cobrancaPacote.valor) +
          " — Em aberto</span>" +

          "<button class='small-button' " +
          "onclick='marcarPacotePago(" +
          aluno.id +
          ")'>" +
          "Marcar como pago" +
          "</button>";
      }

      if (restantes === 0) {
        financeiroPacote +=
          "<div class='sessao-detalhe' style='margin-top:8px;font-weight:bold'>" +
          "Pacote encerrado — renovar pacote" +
          "</div>";
      }

      financeiroPacote +=
        "</div>";
    }

    const card =
      document.createElement("div");

    card.className = "client";

    card.innerHTML =
      "<h3>" +
      aluno.nome +
      "</h3>" +

      "<p>" +
      descricaoAluno(aluno) +
      "</p>" +

      financeiroQuinzenal +

      financeiroMensal +

      financeiroPacote +

      "<p> sessões registradas: " +
      sessoesAluno.length +
      "</p>" +

      "<button class='secondary small-button' " +
      "onclick='alternarHistorico(" +
      aluno.id +
      ")'>" +
      "Ver histórico de sessões" +
      "</button>" +

      "<div class='historico' " +
      "id='historico-" +
      aluno.id +
      "'>" +

      "<h4>Histórico de sessões</h4>" +

      historicoHtml +

      "</div>";

    lista.appendChild(card);

    const option =
      document.createElement("option");

    option.value = aluno.id;
    option.textContent = aluno.nome;

    select.appendChild(option);
  });
}


function abrirEdicaoSessao(sessaoId) {

  const caixa =
    document.getElementById(
      "editar-" + sessaoId
    );

  if (!caixa) return;

  caixa.style.display =
    caixa.style.display === "block"
      ? "none"
      : "block";
}


function salvarEdicaoSessao(sessaoId) {

  const sessao =
    sessoes.find(s =>
      Number(s.id) === Number(sessaoId)
    );

  if (!sessao) return;

  if (sessao.status === "reposicao") {
    alert(
      "A reposição vinculada não pode ser transformada por esta edição. " +
      "Se estiver errada, use Desfazer e registre novamente."
    );
    return;
  }

  const reposicoesLigadas =
    sessoes.filter(s =>
      s.status === "reposicao" &&
      Number(s.faltaOrigemId) === Number(sessaoId)
    );

  const novaData =
    document.getElementById(
      "editar-data-" + sessaoId
    ).value;

  const novoStatus =
    document.getElementById(
      "editar-status-" + sessaoId
    ).value;

  const novoCobrar =
    document.getElementById(
      "editar-cobrar-" + sessaoId
    ).value;

  const novoPagamento =
    document.getElementById(
      "editar-pagamento-" + sessaoId
    ).value;

  if (!novaData) {
    alert("Informe a data da sessão.");
    return;
  }

  if (
    reposicoesLigadas.length > 0 &&
    (
      novoStatus !== "falta" ||
      novoCobrar !== "sim"
    )
  ) {

    const confirmar =
      confirm(
        "Esta falta possui uma reposição vinculada. " +
        "Com esta alteração, a reposição deixará de ter uma falta cobrada como origem e será removida. Continuar?"
      );

    if (!confirmar) return;

    const idsReposicoes =
      new Set(
        reposicoesLigadas.map(r =>
          Number(r.id)
        )
      );

    sessoes =
      sessoes.filter(s =>
        !idsReposicoes.has(Number(s.id))
      );
  }

  sessao.data = novaData;
  sessao.status = novoStatus;
  sessao.cobrar = novoCobrar;
  sessao.pagamento = novoPagamento;

  const aluno =
    alunos.find(a =>
      Number(a.id) === Number(sessao.alunoId)
    );

  let novoValor = 0;

  if (
    aluno &&
    aluno.tipo === "sessao" &&
    novoCobrar === "sim"
  ) {
    novoValor =
      Number(aluno.valorSessao || 0);
  }

  sessao.valor = novoValor;

  localStorage.setItem(
    "sessoes",
    JSON.stringify(sessoes)
  );

  atualizarAlunos();
  atualizarResumo();
}


function desfazerSessao(sessaoId) {

  const sessao =
    sessoes.find(s =>
      Number(s.id) === Number(sessaoId)
    );

  if (!sessao) return;

  const reposicoesLigadas =
    sessoes.filter(s =>
      s.status === "reposicao" &&
      Number(s.faltaOrigemId) === Number(sessaoId)
    );

  let mensagem =
    "Deseja desfazer este lançamento?";

  if (reposicoesLigadas.length > 0) {
    mensagem =
      "Esta falta possui uma reposição vinculada. " +
      "Ao desfazer a falta, a reposição também será removida. Continuar?";
  }

  const confirmar =
    confirm(mensagem);

  if (!confirmar) return;

  const idsRemover =
    new Set([
      Number(sessaoId),
      ...reposicoesLigadas.map(r => Number(r.id))
    ]);

  sessoes =
    sessoes.filter(s =>
      !idsRemover.has(Number(s.id))
    );

  localStorage.setItem(
    "sessoes",
    JSON.stringify(sessoes)
  );

  atualizarAlunos();
  atualizarResumo();
}


function alternarHistorico(alunoId) {

  const historico =
    document.getElementById(
      "historico-" + alunoId
    );

  if (!historico) return;

  historico.style.display =
    historico.style.display === "block"
      ? "none"
      : "block";
}


function obterFaltasDisponiveisReposicao(alunoId) {

  return sessoes
    .filter(sessao =>
      Number(sessao.alunoId) === Number(alunoId) &&
      sessao.status === "falta" &&
      sessao.cobrar === "sim" &&
      !sessoes.some(reposicao =>
        reposicao.status === "reposicao" &&
        Number(reposicao.faltaOrigemId) === Number(sessao.id)
      )
    )
    .sort((a, b) =>
      String(b.data).localeCompare(String(a.data))
    );
}


function atualizarCamposSessao() {

  const status =
    document.getElementById("status").value;

  const campoReposicao =
    document.getElementById("campoReposicao");

  const campoCobrar =
    document.getElementById("campoCobrar");

  const pagamento =
    document.getElementById("pagamento");

  if (status === "reposicao") {

    campoReposicao.style.display = "block";
    campoCobrar.style.display = "none";
    pagamento.value = "aberto";

    const alunoId =
      Number(document.getElementById("aluno").value);

    const selectFalta =
      document.getElementById("faltaReposicao");

    const faltas =
      obterFaltasDisponiveisReposicao(alunoId);

    selectFalta.innerHTML = "";

    if (faltas.length === 0) {

      const option =
        document.createElement("option");

      option.value = "";
      option.textContent =
        "Nenhuma falta cobrada disponível";

      selectFalta.appendChild(option);

    } else {

      faltas.forEach(falta => {

        const option =
          document.createElement("option");

        option.value = falta.id;
        option.textContent =
          "Falta de " + formatarData(falta.data);

        selectFalta.appendChild(option);
      });
    }

  } else {

    campoReposicao.style.display = "none";
    campoCobrar.style.display = "block";
  }
}


function abrirFormulario() {

  if (alunos.length === 0) {
    alert("Cadastre um aluno primeiro.");
    return;
  }

  document.getElementById("formSessao").style.display =
    "block";

  if (!document.getElementById("data").value) {

    const hoje = new Date();

    document.getElementById("data").value =
      hoje.toISOString().split("T")[0];
  }

  atualizarCamposSessao();
}


function salvarSessao() {

  const alunoId =
    Number(
      document.getElementById("aluno").value
    );

  const aluno =
    alunos.find(a =>
      Number(a.id) === alunoId
    );

  if (!aluno) {
    alert("Selecione um aluno.");
    return;
  }

  const data =
    document.getElementById("data").value;

  if (!data) {
    alert("Informe a data da sessão.");
    return;
  }

  const status =
    document.getElementById("status").value;

  let cobrar =
    document.getElementById("cobrar").value;

  const pagamento =
    document.getElementById("pagamento").value;

  let faltaOrigemId = null;

  if (status === "reposicao") {

    faltaOrigemId =
      Number(
        document.getElementById("faltaReposicao").value
      );

    if (!faltaOrigemId) {
      alert("Este aluno não tem falta cobrada disponível para reposição.");
      return;
    }

    cobrar = "nao";
  }

  let valor = 0;

  /*
    Por sessão:
    a própria sessão gera a cobrança.

    Quinzenal:
    a sessão NÃO gera cobrança.
    O financeiro é controlado pelas quinzenas.

    Mensal:
    a sessão NÃO gera cobrança.
    O financeiro é controlado pela mensalidade.

    Pacote:
    a sessão NÃO gera nova cobrança.
    Sessão realizada cobrada ou falta cobrada consome 1 sessão do pacote.
  */

  if (
    cobrar === "sim" &&
    aluno.tipo === "sessao"
  ) {

    valor =
      Number(aluno.valorSessao || 0);
  }

  const sessao = {
    id: Date.now(),
    alunoId: aluno.id,
    alunoNome: aluno.nome,
    data,
    status,
    cobrar,
    pagamento,
    valor,
    faltaOrigemId
  };

  sessoes.push(sessao);

  localStorage.setItem(
    "sessoes",
    JSON.stringify(sessoes)
  );

  document.getElementById("mensagemSessao").style.display =
    "block";

  atualizarAlunos();
  atualizarResumo();
}


function atualizarResumo() {

  let totalValor = 0;
  let totalPago = 0;
  let totalAberto = 0;

  /*
    Cobranças geradas pelas sessões.
  */

  sessoes.forEach(sessao => {

    const valor =
      Number(sessao.valor || 0);

    totalValor += valor;

    if (
      sessao.pagamento === "pago"
    ) {

      totalPago += valor;

    } else {

      totalAberto += valor;
    }
  });


  /*
    Cobranças quinzenais.
  */

  cobrancas.forEach(cobranca => {

    const valor =
      Number(cobranca.valor || 0);

    totalValor += valor;

    if (
      cobranca.pagamento === "pago"
    ) {

      totalPago += valor;

    } else {

      totalAberto += valor;
    }
  });


  document.getElementById("totalAlunos").textContent =
    alunos.length;

  document.getElementById("totalSessoes").textContent =
    sessoes.length;

  document.getElementById("totalValor").textContent =
    formatarDinheiro(totalValor);

  document.getElementById("totalPago").textContent =
    formatarDinheiro(totalPago);

  document.getElementById("totalAberto").textContent =
    formatarDinheiro(totalAberto);
}


function limparDadosTeste() {

  const confirmar =
    confirm(
      "Deseja apagar todos os alunos, sessões e cobranças cadastrados neste navegador?"
    );

  if (!confirmar) return;

  alunos = [];
  sessoes = [];
  cobrancas = [];

  localStorage.removeItem("alunos");
  localStorage.removeItem("sessoes");
  localStorage.removeItem("cobrancas");

  atualizarAlunos();
  atualizarResumo();

  alert("Dados de teste apagados.");
}


atualizarAlunos();
atualizarResumo();

</script>
